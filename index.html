<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Boss Command Center - HR Agency</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    .card { background-color: #1e293b; border: 1px solid #334155; color: #fff; }
    .form-control, .form-select { background-color: #0f172a; border-color: #334155; color: #fff; }
    .btn-primary { background-color: #2563eb; border: none; }
    .chat-box { height: 250px; overflow-y: auto; background-color: #0f172a; border: 1px solid #334155; padding: 10px; border-radius: 5px; }
  </style>
</head>
<body class="p-4">
  <div class="container-fluid">
    <h2 class="mb-4 text-primary">👑 Boss Command Center - Autonomous HR Agency</h2>
    
    <div class="row g-4">
      <!-- Task Assignment Module -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5>📌 Assign New Task</h5>
          <form id="taskForm">
            <div class="mb-2">
              <label>Employee / Agent</label>
              <select id="employee" class="form-select">
                <option>Project Manager (Chief of Staff)</option>
                <option>Lead Researcher</option>
                <option>Content Writer</option>
                <option>Technical Auditor</option>
                <option>Campaign Builder</option>
                <option>Support Triage</option>
                <option>Performance Analyst</option>
                <option>Outbound / Sales Strategist</option>
              </select>
            </div>
            <div class="mb-2">
              <label>Task Description</label>
              <input type="text" id="task_description" class="form-control" placeholder="e.g. Sourcing 5 React Developers" required>
            </div>
            <div class="mb-3">
              <label>Priority / Status</label>
              <select id="priority" class="form-select">
                <option>Queued</option>
                <option>In Progress</option>
                <option>Completed</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Assign & Log to Sheet</button>
          </form>
          <div id="statusMsg" class="mt-2 text-success" style="display:none;">Task assigned successfully!</div>
        </div>
      </div>

      <!-- Chat with PM Module -->
      <div class="col-md-6">
        <div class="card p-3">
          <h5>💬 Chat with Project Manager (Live Ledger)</h5>
          <div id="chatBox" class="chat-box mb-2">
            <div><strong class="text-info">PM:</strong> Good day Boss. How can I assist you with the HR Agency status today?</div>
          </div>
          <div class="input-group">
            <input type="text" id="chatInput" class="form-control" placeholder="Ask about tasks, leads, blocked status...">
            <button id="sendBtn" class="btn btn-primary">Send</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const TASK_WEBHOOK = 'https://hragency1.app.n8n.cloud/webhook/hr%20agency%20task';
    const CHAT_WEBHOOK = 'https://hragency1.app.n8n.cloud/webhook/chat';

    // 1. Görev Ekleme
    document.getElementById('taskForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const employee = document.getElementById('employee').value;
      const task_description = document.getElementById('task_description').value;
      const priority = document.getElementById('priority').value;

      try {
        await fetch(TASK_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            taskId: 'TASK-' + Date.now(),
            assignedAgent: employee,
            taskDescription: task_description,
            priority: priority,
            status: 'Queued'
          })
        });
        document.getElementById('statusMsg').style.display = 'block';
        document.getElementById('task_description').value = '';
        setTimeout(() => document.getElementById('statusMsg').style.display = 'none', 3000);
      } catch (err) {
        console.error('Webhook Error:', err);
        alert('Görev gönderilirken bir hata oluştu.');
      }
    });

    // 2. Proje Yöneticisi ile Sohbet
    document.getElementById('sendBtn').addEventListener('click', async () => {
      const input = document.getElementById('chatInput');
      const msg = input.value.trim();
      if (!msg) return;

      const box = document.getElementById('chatBox');
      box.innerHTML += `<div><strong>You:</strong> ${msg}</div>`;
      input.value = '';
      box.scrollTop = box.scrollHeight;

      try {
        const response = await fetch(CHAT_WEBHOOK, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chatInput: msg })
        });
        
        const data = await response.json();
        const reply = data.output || data.message || "Yanıt alındı.";
        
        box.innerHTML += `<div><strong class="text-info">PM:</strong> ${reply}</div>`;
      } catch (err) {
        console.error('Chat Error:', err);
        box.innerHTML += `<div><strong class="text-danger">System:</strong> Sohbet sunucusuna bağlanılamadı.</div>`;
      }
      box.scrollTop = box.scrollHeight;
    });
  </script>
</body>
</html>
